name: Winter Arc push
on:
  schedule:
    - cron: '0 1-23/2 * * *'   # every 2 hours = 6:30, 8:30 ... 22:30 IST
  workflow_dispatch:           # manual "Run workflow" button for testing
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i web-push --no-save
      - run: node scripts/send.js
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
