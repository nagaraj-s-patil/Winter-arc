<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Winter Arc Tracker</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0b1a;--card:rgba(24,27,56,.72);--card2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.11);--tx:#f4f5ff;--mu:#9ba4cc;--ac:#22d3ee;--gr:#34d399;--ye:#fbbf24;--re:#fb7185;--gy:rgba(255,255,255,.1);--g1:linear-gradient(135deg,#06b6d4,#7c3aed 60%,#ec4899);color-scheme:dark}
html{min-height:100%;background:radial-gradient(620px 400px at 90% -90px,rgba(139,92,246,.5),transparent 70%),radial-gradient(520px 380px at 0% 0,rgba(34,211,238,.3),transparent 70%),radial-gradient(520px 420px at 50% 100%,rgba(236,72,153,.2),transparent 70%),var(--bg);background-attachment:fixed}
body{margin:auto;background:transparent;color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 104px;max-width:560px;overflow-x:hidden}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px;background:linear-gradient(90deg,#fff,#a5f3fc 60%,#f9a8d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7dd3fc;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0}
.card .row{background:var(--card2)}
.mu{color:var(--mu);font-size:13.5px}
button,input,select{font:inherit;color:inherit}
button{background:var(--g1);border:0;border-radius:14px;min-height:50px;padding:0 16px;font-weight:700;color:#fff;width:100%;margin:6px 0;cursor:pointer;box-shadow:0 6px 20px rgba(124,58,237,.3);transition:transform .08s,filter .15s}
button:active{transform:scale(.97);filter:brightness(.9)}
button.sec{background:var(--card2);border:1px solid var(--bd);box-shadow:none}
button.dng{background:transparent;border:1px solid rgba(251,113,133,.5);color:#fda4af;box-shadow:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two button{margin:0}
input[type=text],input[type=number],select{width:100%;min-height:50px;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:14px;padding:0 14px;margin:5px 0;outline:0;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
select option{background:#14162e}
input[type=number]{-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row{--c:#34d399;display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 14px;margin:9px 0;background:var(--card);border:1px solid var(--bd);border-radius:18px;font-size:16.5px;font-weight:500;transition:background .2s,border-color .2s}
.row[class*=" t-"]{border-left:5px solid var(--c)}
.t-wo{--c:#fb923c}.t-wd{--c:#a78bfa}.t-sp{--c:#f472b6}.t-fr{--c:#22d3ee}.t-rd{--c:#fbbf24}.t-min{--c:#94a3b8}
.row:has(input[type=checkbox]:checked){background:color-mix(in srgb,var(--c) 20%,#131530);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.row:has(input[type=checkbox]:checked)>span{color:#fff}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c,#34d399);background:transparent;display:grid;place-content:center;flex:none;cursor:pointer;margin:0;transition:background .15s}
input[type=checkbox]::after{content:"";width:12px;height:7px;border:solid #0a0b1a;border-width:0 0 3.5px 3.5px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .12s}
input[type=checkbox]:checked{background:var(--c,#34d399)}
input[type=checkbox]:checked::after{transform:rotate(-45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.6;cursor:default}
.row input.tm{width:84px;min-height:44px;margin:0 0 0 auto;padding:0 8px;text-align:center;flex:none;background:rgba(0,0,0,.25)}
.row button.plus{width:46px;min-height:46px;margin:0 0 0 auto;padding:0;font-size:26px;border-radius:50%;flex:none}
.bar{height:10px;background:var(--gy);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2563eb,#7c3aed 55%,#db2777);border:0;box-shadow:0 12px 34px rgba(124,58,237,.35)}
.hero::after{content:"❄";position:absolute;right:14px;top:2px;font-size:92px;opacity:.16}
.hero .mu{color:rgba(255,255,255,.85)}.hero .bar{background:rgba(255,255,255,.28)}.hero .bar i{background:#fff}
.big{font-size:40px;font-weight:800;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .big{font-size:46px;line-height:1.1;margin:2px 0 12px;background:none;-webkit-text-fill-color:#fff}
.warn{background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.5);color:#fecdd3;border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:600}
.warn.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5);color:#a7f3d0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stats>div{--c:#fb923c;min-width:0;background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--c);border-radius:18px;padding:12px;text-align:center;font-size:13px;color:var(--mu)}
.stats>div:nth-child(2){--c:#22d3ee}.stats>div:nth-child(3){--c:#f472b6}.stats>div:nth-child(4){--c:#fbbf24}
.stats b{font-size:30px;display:block;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips span{padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:var(--card2);border:1px solid var(--bd);margin:0;box-shadow:none}.tabs .on{background:var(--g1);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.grid i{text-align:center;color:var(--mu);font-style:normal;font-size:13px;font-weight:700}
.grid button{min-height:44px;padding:0;margin:0;border-radius:12px;font-weight:700;font-size:15px;box-shadow:none}
.cg{background:var(--card2)!important;border:1px solid var(--bd);color:var(--mu)}.cg:disabled{opacity:.4}
.cgr{background:linear-gradient(135deg,#10b981,#34d399)!important;color:#04261a}.cy{background:linear-gradient(135deg,#f59e0b,#fbbf24)!important;color:#2a1a00}.cr{background:linear-gradient(135deg,#f43f5e,#fb7185)!important;color:#fff}
.td{box-shadow:0 0 0 2px var(--ac)}.sel{outline:3px solid #fff;outline-offset:1px}
summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;font-weight:700;margin:14px 0 4px}
summary::-webkit-details-marker{display:none}details[open]>summary{border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;display:flex;background:rgba(14,15,34,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--bd);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;border-radius:0;margin:0;min-height:64px;font-size:11px;font-weight:700;color:var(--mu);padding:6px 0 0;position:relative;box-shadow:none}
nav .ic{display:block;font-size:21px;line-height:1.25}
nav .on{color:#fff}nav .on .ic{filter:drop-shadow(0 0 8px #22d3ee)}nav .on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:var(--g1)}

.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 5s ease-in-out infinite;pointer-events:none}
.hero::after{animation:spin 40s linear infinite}
.rg{display:flex;align-items:center;gap:10px;margin:24px 0 8px}.rg i{font-style:normal;font-size:20px}.rg h2{margin:0;color:var(--c)}
.rule{--c:#fb923c;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:18px;padding:14px;margin:9px 0}
.rule .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0a0b1a;background:var(--c)}
.rule p{margin:0;font-size:15.5px;line-height:1.45;color:#dfe3ff}.rule p b{color:#fff;display:block;font-size:16.5px;margin-bottom:2px}
.tl{position:relative;margin:6px 0 0 6px;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(#fb923c,#a78bfa,#f472b6,#22d3ee,#fbbf24,#818cf8)}
.tli{--c:#94a3b8;position:relative;display:flex;align-items:center;gap:12px;min-height:50px;margin:8px 0;padding:8px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.tli::before{content:"";position:absolute;left:-26px;top:50%;width:15px;height:15px;margin-top:-7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px #0a0b1a,0 0 12px var(--c)}
.tli b{min-width:70px;color:var(--c);font-variant-numeric:tabular-nums}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.enter .bar i{transform-origin:left;animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) both}
.row.pop{animation:pop .4s ease}.row.pop input[type=checkbox]{animation:tick .45s ease}
nav .on .ic{animation:bounce .45s ease}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall 1.9s ease-in forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes pop{40%{transform:scale(1.035)}}
@keyframes tick{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheen{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes bounce{40%{transform:translateY(-5px) scale(1.15)}}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@property --p{syntax:'<number>';inherits:false;initial-value:0}
.hero.s{background:linear-gradient(135deg,#0891b2,#7c3aed 70%)}.hero.w{background:linear-gradient(135deg,#7c3aed,#db2777)}
.hr{display:flex;align-items:center;gap:18px}
.big2{font-size:36px;font-weight:800;line-height:1.1}
.rw{position:relative;width:96px;height:96px;flex:none}
.ring{--p:0;position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px))}
.rt{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px}
.mh{--c:#22d3ee;display:flex;justify-content:space-between;align-items:center;margin:26px 0 8px}
.mh b{font-size:19px;color:var(--c)}.mh .pc{font-weight:800;font-size:20px;color:var(--c)}
.t-oct{--c:#22d3ee}.t-nov{--c:#a78bfa}.t-dec{--c:#f472b6}
.bar.mb{margin-bottom:6px}.bar.mb i{background:var(--c)}
.pips{display:flex;gap:6px;margin-top:12px}.pips i{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.22)}.pips i.on{background:#fff}
.wcard{--c:#a78bfa;border-left:5px solid var(--c)}
.wcard>b{font-size:21px;color:#c4b5fd;display:block;margin-bottom:2px}
.mk{--c:#fb7185;display:flex;gap:10px;align-items:center;min-height:44px;margin-top:6px;font-size:14px;color:var(--mu)}
.mk:has(input:checked){color:#fda4af}
.empty{text-align:center;padding:30px 0;font-size:38px;line-height:1.5}.empty .mu{font-size:14px}
.enter .ring{animation:fill 1.2s .15s cubic-bezier(.2,.8,.2,1) both}
.enter .pips i.on{animation:pipin .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--k)*60ms + .25s)}
@keyframes fill{from{--p:0}}
@keyframes pipin{from{transform:scale(0);opacity:0}}
</style></head><body>
<div id="app"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<nav>
<button data-a="nav" data-v="today"><span class="ic">✅</span>Today</button><button data-a="nav" data-v="cal"><span class="ic">🗓</span>Calendar</button>
<button data-a="nav" data-v="week"><span class="ic">📊</span>Weekly</button><button data-a="nav" data-v="rules"><span class="ic">📌</span>Rules</button><button data-a="nav" data-v="syl"><span class="ic">📚</span>Syllabus</button>
<button data-a="nav" data-v="words"><span class="ic">🔤</span>Words</button></nav>
<script>
/* ===== CONFIG ===== */
const S0='2026-10-01',E0='2026-12-31',KEY='winterArc.v1';
const T=['wo','wd','sp','fr','rd'];               // 5 daily tasks
const MN={10:'Oct',11:'Nov',12:'Dec'};
const SY={
 Oct:['Python basics','Python OOP','Files / JSON / errors','JavaScript revision','HTML / CSS','SQL (SELECT / JOIN / GROUP BY)','Git and GitHub','Install bench + first DocType','Project 1: Python CLI Lead Tracker'],
 Nov:['DocTypes','Permissions','Client scripts','Server scripts','Reports','Print formats','Workflows','Library Management tutorial','Project 2: Sales Lead Tracker app'],
 Dec:['Hooks','Whitelisted APIs','Jinja','REST API','ERPNext basics','Project 3: Custom app + README','Resume + LinkedIn','Apply to 10 jobs']};

/* ===== STORAGE ===== */
const blank=()=>({days:{},weeks:{},words:[],syl:{}});
let st=blank();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.days)st=Object.assign(blank(),s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){alert('Could not save. Browser storage is blocked or full.')}}

/* ===== HELPERS ===== */
const $=q=>document.querySelector(q);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const[y,m,d]=s.split('-');return new Date(+y,m-1,+d)};
const fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function add(s,n){const d=pd(s);d.setDate(d.getDate()+n);return fd(d)}
const today=()=>fd(new Date());
const inPlan=s=>s>=S0&&s<=E0;
const clamp=s=>s<S0?S0:s>E0?E0:s;
const dow=s=>pd(s).getDay();
const isRest=s=>dow(s)===0||dow(s)===3;                 // Sun + Wed
const wlab=w=>pd(w).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const WEEKS=[];for(let w='2026-10-04';w<='2026-12-27';w=add(w,7))WEEKS.push(w); // Sundays (must come after helpers)
let view='today',calM='10',calSel=null,wkSel=null,test=null,showP=false,focusNw=false,animNext=true,popK=null,popD=null,setOpen=false;

/* ===== DAY LOGIC ===== */
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
const tmt=s=>hm(['wo','sp','fr'].reduce((a,k)=>a+(+(st.days[s]&&st.days[s].t&&st.days[s].t[k])||0),0));
const isDone=(s,k)=>k==='wo'&&isRest(s)?true:!!(st.days[s]&&st.days[s][k]);  // rest day = workout done
const cnt=s=>T.filter(k=>isDone(s,k)).length;
const ok=s=>!!((st.days[s]&&st.days[s].min)||cnt(s)>=3);    // "not missed": minimum toggle OR 3+ tasks
function col(s){if(s>today())return'cg';const c=cnt(s);return c===T.length?'cgr':(c>=3||(st.days[s]&&st.days[s].min))?'cy':'cr'}
function streaks(){                                         // current + best streak
 const t=clamp(today()),r=today();let run=0,best=0;
 for(let s=S0;s<=t&&s<=r;s=add(s,1)){if(ok(s)){run++;best=Math.max(best,run)}else if(s<r)run=0}
 return{cur:run,best}}
function book(s){return s<='2026-10-30'?'Book 1: The Power of Your Subconscious Mind':s<='2026-11-25'?'Book 2: The Alchemist':s<='2026-12-28'?'Book 3: Rich Dad Poor Dad':'Buffer: review and catch up'}

/* ===== BOOKS / PRIVATE / CONTROLS ===== */
const bks=()=>{if(!st.books)st.books=['The Power of Your Subconscious Mind','The Alchemist','Rich Dad Poor Dad'];if(typeof st.bi!=='number')st.bi=0;return st.books};
function bookCard(){const b=bks(),i=st.bi,dn=i>=b.length;
 return `<div class="card">📖 ${dn?'All '+b.length+' books completed 🎉':'Book '+(i+1)+' of '+b.length+': '+E(b[i])}<div class="mu" style="margin:4px 0">Completed: ${Math.min(i,b.length)}/${b.length}</div>${dn?'':'<button class="sec" data-a="bkdone">Book completed ✓ (go to next)</button>'}<button class="sec" data-a="bkadd">+ Add a book</button></div>`}
function pst(){const r=today();let run=0,best=0;for(let s=S0;s<=r;s=add(s,1)){if(st.days[s]&&st.days[s].np){run++;best=Math.max(best,run)}else if(s<r)run=0}return{cur:run,best}}
function privRow(s){const p=pst();return `<label class="row"><input type="checkbox" data-a="np" data-d="${s}" ${st.days[s]&&st.days[s].np?'checked':''}><span>🔒 Private: No-M day<br><span class="mu">Streak ${p.cur} · Best ${p.best}</span></span></label>`}
function ctl(k,s,rest){const d=st.days[s]||{};
 if(k==='wd')return '<button class="plus" data-a="gow">+</button>';
 if(k==='rd')return `<input type="number" class="tm" inputmode="numeric" min="0" placeholder="pages" data-pg="1" data-d="${s}" value="${d.pg||''}">`;
 if(rest)return '';
 return `<input type="number" class="tm" inputmode="decimal" min="0" placeholder="min" data-t="${k}" data-d="${s}" value="${(d.t&&d.t[k])||''}">`}

const IC={wo:'💪',wd:'🔤',sp:'🎤',fr:'💻',rd:'📖'};
function burst(){for(let i=0;i<30;i++){const e=document.createElement('i');e.className='cf';e.style.cssText='left:'+(5+Math.random()*90)+'vw;background:hsl('+Math.floor(Math.random()*360)+',90%,60%);animation-delay:'+(Math.random()*.3)+'s;--x:'+Math.round((Math.random()-.5)*180)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}}
/* ===== SHARED DAY EDITOR (Today + Calendar) ===== */
function editor(s){
 const m=!!(st.days[s]&&st.days[s].min),sun=dow(s)===0;
 const L={wo:['Workout','10 min workout'],wd:['10 words','5 words'],sp:['Speaking (15 min)','5 min speaking'],
  fr:['Frappe ('+(sun?90:70)+' min)','20 min coding'],rd:['Reading (8 pages)','5 pages']};
 let h=`<label class="row t-min"><input type="checkbox" data-a="min" data-d="${s}" ${m?'checked':''}><span><b>Minimum day</b><br><span class="mu">Bad day? Do the small version. It still counts.</span></span></label>`;
 T.forEach(k=>{const rest=k==='wo'&&isRest(s);
  h+=`<label class="row t-${k}"><input type="checkbox" data-a="tk" data-d="${s}" data-k="${k}" ${isDone(s,k)?'checked':''} ${rest?'disabled':''}><span>${IC[k]} ${rest?'Rest day ✓':L[k][+m]+(k==='wd'?' <span class="mu">('+st.words.filter(w=>w.date===s).length+' added)</span>':'')}</span>${ctl(k,s,rest)}</label>`});
 if(showP)h+=privRow(s);
 return h+`<div class="mu">${cnt(s)}/${T.length} done · Time logged: <span id="tt-${s}">${tmt(s)}</span></div>`}

/* ===== TODAY ===== */
function notifySetup(){
 const n=st.notify||{},on=!!n.enabled,sup='Notification' in window,pm=sup?Notification.permission:'none';
 const msg=!sup?'Not supported here. iPhone: Share → Add to Home Screen, then open from the icon.':pm==='denied'?'Blocked. Allow notifications for this site in your browser settings.':!on?'Turn ON to get a reminder every 2 hours (6 AM to 11 PM).':n.sub?'✅ Phone push ready. Copy the device code and save it in GitHub (see README).':'Reminders work while this app is open. For closed-app push, open it from your https website.';
 return `<div class="card"><h2 style="margin-top:0">🔔 Notifications</h2><div class="mu">${msg}</div>
 <button class="${on?'dng':'pri'}" data-a="notif">${on?'Turn OFF reminders':'Turn ON reminders'}</button>
 ${on?`<div class="two"><button class="sec" data-a="tnot">Send test</button>${n.sub?'<button class="sec" data-a="csub">Copy device code</button>':'<span></span>'}</div>`:''}
 ${on&&n.next?`<div class="mu" style="margin-top:8px">Next in-app reminder: ${new Date(n.next).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>`:''}</div>`}
const VAPID='BCRAi9qZMGFQU0moiQTCXgtxdNuXX3C9MZF0wbU5aYP2luosQLnD-b00rRDuxzBUjaSLDZyTjHsQT1l9uaVAkO8';
const u8=b=>{const r=(b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(r),c=>c.charCodeAt(0))};
async function showN(t,b){const o={body:b,icon:'icon-192.png',badge:'icon-192.png',tag:'winter-arc'};
 const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)return r.showNotification(t,o);new Notification(t,o)}
async function pushOn(){
 try{
  if(!('Notification' in window))return alert('Notifications are not supported here. iPhone: Share → Add to Home Screen first.');
  const p=await Notification.requestPermission();if(p!=='granted')return alert('Notifications are blocked. Allow them in site settings.');
  let sub=null;const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
  if(reg&&'PushManager' in window){await navigator.serviceWorker.ready;
   sub=(await reg.pushManager.getSubscription())||(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)}))}
  st.notify={enabled:true,next:Date.now()+72e5,sub:sub?sub.toJSON():null};save();render()
 }catch(e){alert('Could not turn on: '+e.message)}}
async function pushOff(){
 try{const r=await navigator.serviceWorker.getRegistration(),s=r&&await r.pushManager.getSubscription();if(s)await s.unsubscribe()}catch(e){}
 st.notify={enabled:false,next:0,sub:null};save();render()}
function checkNotify(){
 if(!st.notify||!st.notify.enabled||!('Notification' in window)||Notification.permission!=='granted')return;
 if(Date.now()<Number(st.notify.next||0))return;
 const h=new Date().getHours();if(h>=6&&h<23)showN('Winter Arc','2 hours are up. Check your tasks and keep going.');
 st.notify.next=Date.now()+72e5;save();if(view==='today')render()}
function vToday(){
 const r=today(),s=clamp(r),n=r<S0?0:Math.round((pd(s)-pd(S0))/864e5)+1,y=add(r,-1),sk=streaks();
 let h=`<h1>Winter Arc Tracker</h1><div class="card hero"><div class="mu">${pd(s).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="big">${n?'Day '+n+' of 92':'Starts Oct 1'}</div><div class="bar"><i style="width:${n/92*100}%"></i></div></div>`;
 if(inPlan(y)&&!ok(y))h+='<div class="warn">You missed yesterday. Never miss twice in a row.</div>';
 h+=`<div class="stats"><div><b>${sk.cur}</b>Streak</div><div><b>${sk.best}</b>Best streak</div></div>${bookCard()}`+editor(s);
 return h+`<details id="set" ${setOpen?'open':''}><summary>⚙️ Settings: backup</summary>`+`<h2>Data</h2><div class="two"><button class="sec" data-a="exp">Export backup</button><button class="sec" data-a="imp">Import backup</button></div><button class="dng" style="margin-top:12px" data-a="rst">Reset all data</button></details>`}

/* ===== CALENDAR ===== */
function vCal(){
 let h='<h1>Calendar</h1><div class="tabs">'+Object.keys(MN).map(m=>`<button data-a="cm" data-v="${m}" class="${calM===m?'on':''}">${MN[m]}</button>`).join('')+'</div><div class="grid">';
 'MTWTFSS'.split('').forEach(x=>h+=`<i>${x}</i>`);
 const off=(pd('2026-'+calM+'-01').getDay()+6)%7,dim=new Date(2026,+calM,0).getDate();
 for(let i=0;i<off;i++)h+='<i></i>';
 for(let d=1;d<=dim;d++){const s=`2026-${calM}-${String(d).padStart(2,'0')}`;
  h+=`<button data-a="cd" data-d="${s}" class="${col(s)} ${s===today()?'td':''} ${calSel===s?'sel':''}" ${s>today()?'disabled':''}>${d}</button>`}
 h+='</div><div class="mu" style="margin:10px 0">Green: all 5 · Yellow: 3-4 · Red: 0-2 · Grey: future</div>';
 return h+(calSel?`<h2>${pd(calSel).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</h2>`+editor(calSel):'')}

/* ===== WEEKLY ===== */
function wk(w){                                             // auto stats + score for a week ending Sunday w
 const D=[];for(let i=-6;i<=0;i++){const s=add(w,i);if(inPlan(s))D.push(s)}
 const n=D.length,wd=D.filter(s=>!isRest(s)),m=st.weeks[w]||{},max=w==='2026-10-04'?30:60,
 c=k=>D.filter(s=>isDone(s,k)).length,wo=wd.filter(s=>isDone(s,'wo')).length,pgA=D.reduce((a,s)=>a+(+(st.days[s]&&st.days[s].pg)||0),0),wn=st.words.filter(w=>D.includes(w.date)).length,tm=k=>D.reduce((a,s)=>a+(+(st.days[s]&&st.days[s].t&&st.days[s].t[k])||0),0),fh=Math.round((tm('fr')/60||+m.fh||0)*10)/10,sc=+m.sc||0,
 P={fr:Math.min(fh/(8.5*n/7),1)*30,wo:wo/wd.length*20,sp:c('sp')/n*15,sc:Math.min(sc/max,1)*15,rd:c('rd')/n*10,co:D.filter(s=>ok(s)).length/n*10}; // 8.5h = 6x70min + 90min
 return{wo,wt:wd.length,n,fr:c('fr'),sp:c('sp'),rd:c('rd'),max,fh,sc,pg:pgA||+m.pg||0,wn,tmx:{wo:tm('wo'),wd:tm('wd'),sp:tm('sp'),fr:tm('fr'),rd:tm('rd')},m,P,score:Math.round(Object.values(P).reduce((a,b)=>a+b,0)),missed:D.filter(s=>s<today()&&!ok(s)).length}}
function wkOut(w){
 const c=wk(w),p=WEEKS[WEEKS.indexOf(w)-1],started=add(w,-6)<=today();
 let h=`<div class="stats"><div><b>${c.wo}/${c.wt}</b>Workouts</div><div><b>${c.fr}/${c.n}</b>Frappe days</div><div><b>${c.sp}/${c.n}</b>Speaking days</div><div><b>${c.rd}/${c.n}</b>Reading days</div></div><div class="card"><b>Time this week (auto)</b><div class="chips"><span style="--c:#fb923c">💪 ${hm(c.tmx.wo)}</span><span style="--c:#a78bfa">🔤 ${c.wn} words</span><span style="--c:#f472b6">🎤 ${hm(c.tmx.sp)}</span><span style="--c:#22d3ee">💻 ${hm(c.tmx.fr)}</span><span style="--c:#fbbf24">📖 ${c.pg} pages</span></div></div>`+
 `<div class="card">Score<div class="big">${c.score}/100</div><div class="mu">Frappe ${c.P.fr|0}/30, Workout ${c.P.wo|0}/20, Speaking ${c.P.sp|0}/15, Spelling ${c.P.sc|0}/15, Reading ${c.P.rd|0}/10, Consistency ${c.P.co|0}/10</div></div>`;
 if(c.missed>=3)h+='<div class="warn">FAIL WEEK - repeat this week\'s Frappe topic</div>';
 if(started&&c.score<70)h+='<div class="warn">Score below 70. Fix it next week.</div>';
 if(started&&c.score<50&&p&&wk(p).score<50)h+='<div class="warn">CUT GOALS: below 50 two weeks in a row. Reduce the plan.</div>';
 return h}
function report(w){const c=wk(w);
 return `Workouts ${c.wo}/${c.wt}, Frappe hours ${c.fh}, Pages read ${c.pg}, Speaking days ${c.sp}/${c.n}, Spelling test ${c.sc}/${c.max}, What I built ${c.m.built||'-'}, Biggest excuse ${c.m.excuse||'-'}.`}
function vWeek(){
 if(!wkSel)wkSel=WEEKS.filter(w=>add(w,-6)<=today()).pop()||WEEKS[0];
 const m=st.weeks[wkSel]||{},max=wkSel==='2026-10-04'?30:60;
 const f=(k,l,t)=>`<div class="mu" style="margin-top:8px">${l}</div><input type="${t}" ${t==='number'?'inputmode="decimal"':''} data-w="${k}" value="${E(m[k])}">`;
 return `<h1>Weekly review</h1><select data-a="wsel">${WEEKS.map(w=>`<option value="${w}" ${w===wkSel?'selected':''}>Week ending ${wlab(w)}</option>`).join('')}</select><div id="wko">${wkOut(wkSel)}</div>`+
 f('sc',`Spelling test score (/${max})`,'number')+f('built','What I built','text')+f('excuse','Biggest excuse','text')+
 `<button data-a="copy">📋 Copy Sunday report</button><div class="mu" style="text-align:center">Paste it to your coach every Sunday (Rule 10)</div>`}

/* ===== RULES ===== */
const RULES=[
'Never miss twice in a row. One miss is an accident. Two is a habit.',
'No double work next day. No catch-up burnout.',
'Minimum day: 10 min workout, 5 words, 5 min speaking, 20 min coding, 5 pages. NEVER zero.',
'Missed 2 days in a row: +30 min extra on Sunday and write the REAL reason.',
'Missed 3+ days in a week = FAIL week. Repeat that week’s Frappe topic.',
'Real sickness: rest and tell your coach. Not a fail.',
'Weekly targets: Workouts 5/5, new words 60, speaking 7/7, Frappe 7 hours+, reading 50 pages, GitHub push at least once.',
'Score: Frappe 30, Workout 20, Speaking 15, Spelling 15, Reading 10, Consistency 10.',
'Below 70 = warning. Below 50 two weeks in a row = goals get cut.',
'Every Sunday report: workouts /5, Frappe hours, pages read, speaking /7, spelling test, what I built, biggest excuse.',
'Oct 1–4 is a short week: 3 workouts, 5 Frappe hours, spelling test /30.',
'Use a dictionary for every new word. Wrong spelling-test words go to the Mistake List and return next week.'
];
const RG=[['🔥','Consistency rules',[0,1,2,3,4,5],'#fb923c'],['🎯','Targets and score',[6,7,8],'#22d3ee'],['🗓','Weekly routine',[9,10,11],'#a78bfa']];
const TL=[['6:00','💪','Workout','#fb923c'],['6:30','🔤','Words','#a78bfa'],['6:40','🎤','Speaking','#f472b6'],['9:00–7:00','💼','Sales job','#94a3b8'],['7:30','🍽','Dinner','#94a3b8'],['8:00','💻','Frappe / coding','#22d3ee'],['9:10','📖','Reading','#fbbf24'],['9:30','📵','Phone away','#94a3b8'],['10:00','😴','Sleep','#818cf8']];
const rl=x=>{const m=x.match(/^(.*?[.:])\s+(.*)$/);return m?'<b>'+E(m[1])+'</b>'+E(m[2]):E(x)};
function vRules(){
 return '<h1>Rules</h1><div class="card hero"><b style="font-size:22px;display:block">Rules beat motivation.</b><span class="mu">Follow these 12 rules and the 92 days take care of themselves.</span></div>'+
 RG.map(([ic,t,ix,c])=>`<div class="rg" style="--c:${c}"><i>${ic}</i><h2>${t}</h2></div>`+ix.map(i=>`<div class="rule" style="--c:${c}"><span class="num">${i+1}</span><p>${rl(RULES[i])}</p></div>`).join('')).join('')+
 `<div class="rg" style="--c:#f472b6"><i>⏰</i><h2>Daily timetable</h2></div><div class="tl">`+TL.map(([t,ic,n,c])=>`<div class="tli" style="--c:${c}"><b>${t}</b><span>${ic} ${n}</span></div>`).join('')+'</div>'}

/* ===== SYLLABUS ===== */
const MC={Oct:'oct',Nov:'nov',Dec:'dec'},MF={Oct:'October',Nov:'November',Dec:'December'};
function vSyl(){
 const ks=Object.keys(SY),tot=ks.reduce((a,m)=>a+SY[m].length,0),dn=ks.reduce((a,m)=>a+SY[m].filter((_,i)=>st.syl[m+i]).length,0),pc=Math.round(dn/tot*100);
 let h=`<h1>Syllabus</h1><div class="card hero hr s"><div class="rw"><div class="ring" style="--p:${pc}"></div><div class="rt">${pc}%</div></div><div><div class="mu">Your learning path</div><div class="big2">${dn}/${tot}</div><div class="mu">topics completed</div></div></div>`;
 ks.forEach(mo=>{const it=SY[mo],c=MC[mo],d=it.filter((_,i)=>st.syl[mo+i]).length,p=Math.round(d/it.length*100);
  h+=`<div class="mh t-${c}"><div><b>${MF[mo]}${p===100?' 🎉':''}</b><br><span class="mu">${d} of ${it.length} topics</span></div><div class="pc">${p}%</div></div><div class="bar mb t-${c}"><i style="width:${p}%"></i></div>`+
  it.map((t,i)=>`<label class="row t-${c}"><input type="checkbox" data-a="sy" data-k="${mo+i}" ${st.syl[mo+i]?'checked':''}><span>${/^(Project|Apply)/.test(t)?'🚀 ':''}${t}</span></label>`).join('')});
 return h}

/* ===== WORDS + SUNDAY TEST ===== */
function vWords(){
 if(test)return vTest();
 const t=today(),n=st.words.filter(w=>w.date===t).length,by={},mis=st.words.filter(w=>w.mistake).length;
 let h=`<h1>Words</h1><div class="card hero w"><div class="mu">Words today</div><div class="big2">${n}<span style="font-size:20px;opacity:.8">/10</span></div><div class="pips">${Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}" style="--k:${i}"></i>`).join('')}</div></div>`+
 `<div class="stats"><div><b>${st.words.length}</b>Total words</div><div><b>${mis}</b>Mistake list</div></div>`+
 `<div class="card"><h2 style="margin-top:0">✨ Add a new word</h2><input type="text" id="nw" placeholder="Word" autocapitalize="off"><input type="text" id="ns" placeholder="One sentence using the word"><button data-a="addw">Add word</button></div><button class="sec" data-a="tst">🧪 Start Sunday test (last 7 days)</button>`;
 if(!st.words.length)h+=`<div class="empty">📝<br>No words yet.<br><span class="mu">Add your first word above.</span></div>`;
 st.words.forEach(w=>(by[w.date]=by[w.date]||[]).push(w));
 Object.keys(by).sort().reverse().forEach(d=>{h+=`<div class="mh t-wd"><div><b>${pd(d).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</b></div><div class="pc">${by[d].length}</div></div>`+by[d].map(w=>`<div class="card wcard"><b>${E(w.word)}</b><div class="mu">${E(w.sent)}</div><label class="mk"><input type="checkbox" data-a="ms" data-id="${w.id}" ${w.mistake?'checked':''}> ⚠ Mistake list</label></div>`).join('')});
 return h}
function vTest(){
 const q=test.q;
 if(test.i>=q.length)return `<h1>Test done</h1><div class="card"><div class="big">${test.right}/${q.length}</div><div class="mu">Wrong words are on your mistake list. Enter your score in Weekly.</div></div><button data-a="tend">Close</button>`;
 const w=q[test.i],rx=new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=w.sent.replace(rx,'_____');
 return `<h1>Test ${test.i+1}/${q.length}</h1><div class="card" style="font-size:19px">${E(m)}</div>`+
  (test.res==null?`<input type="text" id="ans" autocomplete="off" autocapitalize="off" placeholder="Type the word"><button data-a="chk">Check</button>`
  :`<div class="warn ${test.res?'ok':''}">${test.res?'Correct':'Wrong. Answer: '+E(w.word)}</div><button data-a="nxt">Next</button>`)+
  `<button class="sec" data-a="tend">Quit test</button>`}

/* ===== RENDER ===== */
function render(){
 const app=$('#app');app.classList.remove('enter');app.innerHTML={today:vToday,cal:vCal,week:vWeek,rules:vRules,syl:vSyl,words:vWords}[view]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 if(popK){const el=document.querySelector('input[data-a="tk"][data-d="'+popD+'"][data-k="'+popK+'"]');if(el)el.closest('.row').classList.add('pop');popK=null}
 if(animNext){[...app.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,14)));app.classList.add('enter');animNext=false}
 const a=$('#ans');if(a)a.focus();const nw=$('#nw');if(nw&&focusNw){nw.focus();focusNw=false}}

/* ===== EVENTS ===== */
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v;
 if(a==='nav'){view=v;test=null;calSel=null;animNext=true}
 else if(a==='cm'){calM=v;calSel=null;animNext=true}
 else if(a==='cd')calSel=b.dataset.d;
 else if(a==='addw'){
  const w=$('#nw').value.trim(),s=$('#ns').value.trim();
  if(!w||!s)return alert('Add both the word and a sentence.');
  st.words.push({id:Date.now()+Math.random().toString(36).slice(2,6),date:today(),word:w,sent:s,mistake:false});save()}
 else if(a==='tst'){
  const pool=st.words.filter(w=>w.date>=add(today(),-6));
  if(!pool.length)return alert('No words from the last 7 days.');
  test={q:pool.sort(()=>Math.random()-.5),i:0,right:0,res:null}}
 else if(a==='chk'){const w=test.q[test.i];
  test.res=$('#ans').value.trim().toLowerCase()===w.word.trim().toLowerCase();
  if(test.res)test.right++;else{w.mistake=true;save()}}
 else if(a==='nxt'){test.i++;test.res=null}
 else if(a==='tend')test=null;
 else if(a==='gow'){view='words';test=null;calSel=null;focusNw=true;animNext=true}
 else if(a==='bkdone'){bks();if(!confirm('Mark this book as completed?'))return;st.bi++;save()}
 else if(a==='bkadd'){const t=prompt('Book title?');if(!t||!t.trim())return;bks().push(t.trim());save()}
 else if(a==='notif'){(st.notify&&st.notify.enabled?pushOff():pushOn());return}
 else if(a==='tnot'){showN('Winter Arc test','Notifications work ✅');return}
 else if(a==='csub'){const t=JSON.stringify(st.notify.sub);(navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert('Copied')):Promise.reject()).catch(()=>prompt('Copy this code:',t));return}
 else if(a==='copy'){const t=report(wkSel),done=()=>alert('Copied');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{
   const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();done()});return}
 else if(a==='exp'){const l=document.createElement('a');
  l.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:'application/json'}));
  l.download='winter-arc-backup-'+today()+'.json';l.click();return}
 else if(a==='imp'){$('#file').click();return}
 else if(a==='rst'){if(!confirm('Delete ALL data? This cannot be undone.'))return;st=blank();localStorage.removeItem(KEY)}
 render()});

document.addEventListener('change',e=>{                     // checkboxes + week select
 const t=e.target,a=t.dataset.a;if(!a)return;
 const day=()=>st.days[t.dataset.d]=st.days[t.dataset.d]||{};
 if(a==='wsel')wkSel=t.value;
 else if(a==='tk')day()[t.dataset.k]=t.checked;
 else if(a==='min')day().min=t.checked;
 else if(a==='np')day().np=t.checked;
 else if(a==='sy')st.syl[t.dataset.k]=t.checked;
 else if(a==='ms')st.words.find(w=>w.id===t.dataset.id).mistake=t.checked;
 if(a==='tk'&&t.checked){popD=t.dataset.d;popK=t.dataset.k;if(cnt(t.dataset.d)===T.length)setTimeout(burst,250)}
 save();render()});

document.addEventListener('input',e=>{                      // weekly manual inputs (no re-render, keeps focus)
 const k=e.target.dataset.w;if(!k)return;
 (st.weeks[wkSel]=st.weeks[wkSel]||{})[k]=e.target.value;save();$('#wko').innerHTML=wkOut(wkSel)});

document.addEventListener('input',e=>{                      // daily minutes (no re-render, keeps focus)
 const k=e.target.dataset.t;if(!k)return;
 const s=e.target.dataset.d,d=st.days[s]=st.days[s]||{};d.t=d.t||{};
 const v=parseFloat(e.target.value);if(v>0)d.t[k]=v;else delete d.t[k];
 save();const x=document.getElementById('tt-'+s);if(x)x.textContent=tmt(s)});

document.addEventListener('input',e=>{                      // reading pages (no re-render)
 if(!e.target.dataset.pg)return;const s=e.target.dataset.d,d=st.days[s]=st.days[s]||{};
 const v=parseFloat(e.target.value);if(v>0)d.pg=v;else delete d.pg;save()});

let tapN=0,tapT=0;                                          // triple-tap a page title = show/hide private row
document.addEventListener('click',e=>{if(!e.target.closest('h1'))return;const n=Date.now();tapN=n-tapT<700?tapN+1:1;tapT=n;if(tapN>=3){tapN=0;showP=!showP;render()}});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans')$('[data-a=chk]').click()});

$('#file').addEventListener('change',e=>{                   // import backup
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.days)throw 0;
  if(!confirm('Replace current data with this backup?'))return;
  st=Object.assign(blank(),o);save();render()}catch(x){alert('Invalid backup file.')}};
 r.readAsText(f);e.target.value=''});

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='today')render()}); // new day rollover
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('toggle',e=>{if(e.target.id==='set')setOpen=e.target.open},true);

render();
</script></body></html>
